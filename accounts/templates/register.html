<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#141E30,#243B55);
            overflow:hidden;
        }

        /* Светящиеся круги */
        body::before,
        body::after{
            content:"";
            position:absolute;
            width:300px;
            height:300px;
            border-radius:50%;
            filter:blur(80px);
            z-index:-1;
        }

        body::before{
            background:#00d4ff;
            top:-80px;
            left:-80px;
        }

        body::after{
            background:#7b2ff7;
            bottom:-80px;
            right:-80px;
        }

        .card{
            width:360px;
            padding:35px;
            border-radius:25px;
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(15px);
            border:1px solid rgba(255,255,255,0.2);
            box-shadow:0 20px 40px rgba(0,0,0,.4);
            transform:perspective(1000px) rotateX(5deg);
            transition:.4s;
        }

        .card:hover{
            transform:perspective(1000px) rotateX(0deg) scale(1.03);
            box-shadow:0 30px 60px rgba(0,212,255,.25);
        }

        h2{
            color:#fff;
            text-align:center;
            margin-bottom:25px;
            letter-spacing:1px;
        }

        .error{
            color:#ff8a8a;
            text-align:center;
            margin-bottom:15px;
        }

        label{
            color:#ddd;
            font-size:14px;
            display:block;
            margin:12px 0 6px;
        }

        input{
            width:100%;
            padding:14px;
            border:none;
            outline:none;
            border-radius:12px;
            background:rgba(255,255,255,.12);
            color:#fff;
            font-size:15px;
            transition:.3s;
        }

        input::placeholder{
            color:#bbb;
        }

        input:focus{
            background:rgba(255,255,255,.18);
            box-shadow:0 0 15px rgba(0,212,255,.5);
        }

        button{
            width:100%;
            padding:14px;
            margin-top:25px;
            border:none;
            border-radius:12px;
            background:linear-gradient(90deg,#00d4ff,#7b2ff7);
            color:white;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            transition:.3s;
            box-shadow:0 10px 20px rgba(0,212,255,.35);
        }

        button:hover{
            transform:translateY(-3px);
            box-shadow:0 15px 30px rgba(123,47,247,.45);
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Login</h2>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form action="" method="post">
            {% csrf_token %}

            <label for="Username">Username</label>
            <input type="text" name="username" placeholder="Enter your username">

            <label for="Password">Password</label>
            <input type="password" name="password" placeholder="Enter your password">

            <button type="submit">Register</button>
        </form>
    </div>

</body>
</html>
