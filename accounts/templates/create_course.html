<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Course</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#141E30,#243B55);
            overflow:hidden;
        }

        body::before,
        body::after{
            content:"";
            position:absolute;
            width:260px;
            height:260px;
            border-radius:50%;
            filter:blur(90px);
            z-index:-1;
        }

        body::before{
            background:#00d4ff;
            top:-70px;
            left:-70px;
        }

        body::after{
            background:#00ff99;
            bottom:-70px;
            right:-70px;
        }

        .card{
            width:400px;
            padding:35px;
            border-radius:22px;
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(15px);
            border:1px solid rgba(255,255,255,0.2);
            box-shadow:0 20px 45px rgba(0,0,0,.35);
            transition:.3s;
        }

        .card:hover{
            transform:translateY(-5px) scale(1.02);
            box-shadow:0 25px 50px rgba(0,255,153,.25);
        }

        h1{
            text-align:center;
            color:white;
            margin-bottom:25px;
            text-shadow:0 0 12px #00ff99;
        }

        label{
            display:block;
            margin:12px 0 6px;
            color:#ddd;
            font-size:14px;
        }

        input{
            width:100%;
            padding:13px;
            border:none;
            outline:none;
            border-radius:12px;
            background:rgba(255,255,255,0.12);
            color:white;
            font-size:15px;
            transition:.3s;
        }

        input::placeholder{
            color:#bbb;
        }

        input:focus{
            background:rgba(255,255,255,0.18);
            box-shadow:0 0 15px rgba(0,255,153,.45);
        }

        button{
            width:100%;
            margin-top:25px;
            padding:14px;
            border:none;
            border-radius:12px;
            font-size:16px;
            font-weight:bold;
            color:white;
            cursor:pointer;
            background:linear-gradient(90deg,#00ff99,#00c6ff);
            box-shadow:0 10px 20px rgba(0,255,153,.35);
            transition:.3s;
        }

        button:hover{
            transform:translateY(-3px);
            box-shadow:0 15px 30px rgba(0,198,255,.45);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>➕ Create Course</h1>

        <form action="" method="post">
            {% csrf_token %}

            <label>Title</label>
            <input type="text" name="title" placeholder="Enter course title">

            <label>Description</label>
            <input type="text" name="description" placeholder="Enter course description">

            <label>Price</label>
            <input type="number" name="price" placeholder="Enter course price">

            <button type="submit">Create Course</button>
        </form>
    </div>

</body>
</html>
