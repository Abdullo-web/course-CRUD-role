<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Course</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#141E30,#243B55);
            overflow:hidden;
        }

        body::before,
        body::after{
            content:"";
            position:absolute;
            width:250px;
            height:250px;
            border-radius:50%;
            filter:blur(80px);
            z-index:-1;
        }

        body::before{
            background:#00d4ff;
            top:-60px;
            left:-60px;
        }

        body::after{
            background:#7b2ff7;
            bottom:-60px;
            right:-60px;
        }

        .card{
            width:400px;
            padding:35px;
            border-radius:22px;
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(14px);
            border:1px solid rgba(255,255,255,0.15);
            box-shadow:0 20px 40px rgba(0,0,0,.35);
            transition:.3s;
        }

        .card:hover{
            transform:translateY(-5px);
            box-shadow:0 25px 50px rgba(0,212,255,.25);
        }

        h1{
            text-align:center;
            color:white;
            margin-bottom:25px;
            text-shadow:0 0 12px #00d4ff;
        }

        .error{
            color:#ff8a8a;
            text-align:center;
            margin-bottom:15px;
        }

        label{
            color:#ddd;
            display:block;
            margin:12px 0 6px;
            font-size:14px;
        }

        input{
            width:100%;
            padding:13px;
            border:none;
            outline:none;
            border-radius:12px;
            background:rgba(255,255,255,0.12);
            color:white;
            font-size:15px;
            transition:.3s;
        }

        input:focus{
            background:rgba(255,255,255,0.18);
            box-shadow:0 0 15px rgba(0,212,255,.5);
        }

        button{
            width:100%;
            margin-top:25px;
            padding:14px;
            border:none;
            border-radius:12px;
            font-size:16px;
            font-weight:bold;
            color:white;
            cursor:pointer;
            background:linear-gradient(90deg,#00d4ff,#7b2ff7);
            box-shadow:0 10px 20px rgba(0,212,255,.35);
            transition:.3s;
        }

        button:hover{
            transform:translateY(-3px);
            box-shadow:0 15px 30px rgba(123,47,247,.45);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>✏️ Update Course</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form action="" method="post">
            {% csrf_token %}

            <label>Title</label>
            <input type="text" name="title" value="{{ course.title }}">

            <label>Description</label>
            <input type="text" name="description" value="{{ course.description }}">

            <label>Price</label>
            <input type="number" name="price" value="{{ course.price }}">

            <button type="submit">🚀 Update Course</button>
        </form>
    </div>

</body>
</html>
