<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#0F2027,#203A43,#2C5364);
            overflow:hidden;
        }

        body::before,
        body::after{
            content:"";
            position:absolute;
            width:280px;
            height:280px;
            border-radius:50%;
            filter:blur(90px);
            z-index:-1;
        }

        body::before{
            background:#00d4ff;
            top:-80px;
            left:-80px;
        }

        body::after{
            background:#8a2be2;
            bottom:-80px;
            right:-80px;
        }

        .login-card{
            width:370px;
            padding:35px;
            border-radius:24px;
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(15px);
            border:1px solid rgba(255,255,255,0.2);
            box-shadow:0 20px 45px rgba(0,0,0,.35);
            transition:.35s;
        }

        .login-card:hover{
            transform:translateY(-6px) scale(1.02);
            box-shadow:0 25px 55px rgba(0,212,255,.25);
        }

        h1{
            text-align:center;
            color:#fff;
            margin-bottom:25px;
            text-shadow:0 0 12px #00d4ff;
        }

        .error{
            color:#ff7b7b;
            text-align:center;
            margin-bottom:15px;
            font-size:14px;
        }

        label{
            color:#ddd;
            font-size:14px;
            margin:12px 0 6px;
            display:block;
        }

        input{
            width:100%;
            padding:13px;
            border:none;
            outline:none;
            border-radius:12px;
            background:rgba(255,255,255,0.12);
            color:white;
            font-size:15px;
            transition:.3s;
        }

        input::placeholder{
            color:#bbb;
        }

        input:focus{
            background:rgba(255,255,255,0.18);
            box-shadow:0 0 15px rgba(0,212,255,.45);
        }

        button{
            width:100%;
            margin-top:25px;
            padding:14px;
            border:none;
            border-radius:12px;
            cursor:pointer;
            font-size:16px;
            font-weight:bold;
            color:white;
            background:linear-gradient(90deg,#00d4ff,#8a2be2);
            box-shadow:0 10px 20px rgba(0,212,255,.35);
            transition:.3s;
        }

        button:hover{
            transform:translateY(-3px);
            box-shadow:0 15px 30px rgba(138,43,226,.45);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>🔐 Login</h1>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form action="" method="post">
            {% csrf_token %}

            <label for="Username">Username</label>
            <input type="text" name="username" placeholder="Enter your username">

            <label for="Password">Password</label>
            <input type="password" name="password" placeholder="Enter your password">

            <button type="submit">Login</button>
        </form>
    </div>

</body>
</html>
